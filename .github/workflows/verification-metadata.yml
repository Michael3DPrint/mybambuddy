# Manual helper: regenerates gradle/verification-metadata.xml on Linux (the runner's platform needs a few artifacts a Mac build never downloads)
# and uploads it as a workflow artifact. Nothing is committed: download the file, review the diff, and commit it yourself.
# Run it from the Actions tab (or: gh workflow run verification-metadata.yml), after adding or upgrading a dependency.
name: verification-metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Write verification metadata
        run: ./gradlew --write-verification-metadata sha256 :app:ktlintSourcesFormat :app:check :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
